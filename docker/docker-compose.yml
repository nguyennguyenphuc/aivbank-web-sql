# AIV Bank — dựng toàn bộ hệ thống bằng một lệnh.
#
#     cd app/docker && docker compose up
#
# Frontend KHÔNG có service riêng: nó là file tĩnh do backend phục vụ ở `/`.
# Muốn thay frontend thì đổi `AIVB_FRONTEND_DIR` và mount thư mục build vào —
# xem ../ARCHITECTURE.md mục 5.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
      # BUILTIN_LOCALE 'C' là BẮT BUỘC, không phải tinh chỉnh. Sai collation
      # làm `ORDER BY`/`min`/`max`/`LIKE` ra kết quả khác, tức là đáp án chấm
      # bài sai — và phép kiểm md5 hoàn toàn mù với nó nên vẫn báo PASS.
      # Ép ở đây vì `pg_restore` KHÔNG sửa được collation sau khi database
      # đã tồn tại.
      #
      # ⚠ Dong nay CHI co tac dung o lan `initdb` DAU TIEN cua volume. Mot cum
      # da duoc tao ra khong co no se giu collation sai VINH VIEN, va khong lan
      # `docker compose up` nao sua duoc - do chinh la ly do `restore.py
      # cmd_verify` co mot phep kiem HANH VI (`SELECT 'a' < 'B'`) chu khong chi
      # doc cau hinh.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C --encoding=UTF8"
    secrets:
      - pg_superuser
    volumes:
      # postgres:18 KHONG cho mount vao `/var/lib/postgresql/data` nua: tu 18 image
      # luu du lieu theo thu muc rieng cho tung major version (`.../18/docker`) de
      # `pg_upgrade --link` khong vuong ranh gioi mount. Mount vao dung
      # `/var/lib/postgresql`. Dong cu la quy uoc cua postgres:16/17, va no lam
      # container thoat 1 ngay khi khoi dong.
      # https://github.com/docker-library/postgres/pull/1259
      #
      # ⚠ TREN MOT MAY DA CO `pgdata` TAO RA DUOI MOUNT CU: file PGDATA nam o
      # GOC volume, nen mount vao diem moi se lam entrypoint thay `18/docker`
      # trong, chay `initdb`, va cum cu tro thanh VO HINH - ke ca `aivb_app`.
      # `scripts\Check-PgVolume.ps1` bat dung tinh huong do va `aivb.cmd up`
      # goi no truoc khi len; `scripts\Migrate-PgVolume.ps1` doi tai cho.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Không publish cổng ra ngoài ở đây. Muốn cho Power BI vào thì mở có chủ
    # đích — phơi 5432 ra internet là phơi cả đường thực thi mã qua
    # `COPY ... FROM PROGRAM` nếu ai đó vào được bằng superuser.
    expose:
      - "5432"

  # MOT image cho ba service `restore`, `restore-scm`, `backend` (cung Dockerfile,
  # cung context). Khong dat `image:` thi Compose sinh BA image rieng, va moi
  # lan chi build mot service (`compose build backend`, Enable-Game.ps1) de hai
  # cai kia cu: den 2026-09-29 `restore` van chay script SQL cua 2026-09-01 o
  # MOI lan `up`, am tham keo `scm` CONNECTION LIMIT tu 320 ve 120. Chung ten
  # `docker-backend:latest` (Check-PgVolume.ps1 / Migrate-PgVolume.ps1 goi dich
  # danh ten nay) thi build bat ky service nao cung cap nhat ca ba.
  restore:
    image: docker-backend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIVB_PG_HOST: postgres
      PGPASSWORD_FILE: /run/secrets/pg_superuser
    secrets:
      - pg_superuser
    volumes:
      - ../database/dumps:/app/database/dumps:ro
    # Chạy một lần rồi thoát. Tự nghiệm thu ở cuối: đủ 77/100 bảng, collation
    # đúng, và đáp án chấm bài KHÔNG có trong database học viên.
    command: ["python", "database/restore.py", "restore", "--host", "postgres"]
    restart: "no"

  # SupplyChain di duong RIENG, khong ghep vao `restore` o tren.
  #
  # `restore.py` la cong cu cua AIV Bank: no phuc hoi hai database tu dump va tu
  # nghiem thu theo hop dong 77/100 bang. SupplyChain co hop dong khac (20 bang,
  # 136.586.733 dong) va duoc dung boi `load_scm.py`. Nhet ca hai vao mot lenh se
  # lam `restore.py restore` tuyen bo lo mot database ma no khong biet kiem - dung
  # kieu doi tra ma lop nghiem thu nay ton tai de chan.
  #
  # Bo du lieu nay LA TUY CHON: khong co database/dumps/scm.dump thi service noi
  # ra roi thoat 0, va backend van len voi mot bo du lieu.
  restore-scm:
    image: docker-backend:latest   # xem chu thich o `restore`
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIVB_PG_HOST: postgres
    secrets:
      - pg_superuser
    volumes:
      - ../database/dumps:/app/database/dumps:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f database/dumps/scm.dump ]; then
          echo "khong co database/dumps/scm.dump - bo qua bo du lieu SupplyChain"
          exit 0
        fi
        PGPASSWORD="$$(cat /run/secrets/pg_superuser)"; export PGPASSWORD
        psql -h postgres -U postgres -f database/schema/10_scm_roles.sql
        psql -h postgres -U postgres -f database/schema/11_scm_database.sql
        pg_restore -h postgres -U postgres -d scm --no-owner --no-privileges              --jobs 4 database/dumps/scm.dump
        psql -h postgres -U postgres -d scm -f database/schema/12_scm_schema_grants.sql
        AIVB_SCM_LOAD_USER=postgres python database/load_scm.py verify
    restart: "no"

  backend:
    image: docker-backend:latest   # xem chu thich o `restore`
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      restore:
        condition: service_completed_successfully
      restore-scm:
        condition: service_completed_successfully
    env_file:
      - ../config/app.env
    environment:
      AIVB_PG_HOST: postgres
      # Trong container, backend nghe 0.0.0.0 vì biên mạng là chính container.
      # Trên máy trần thì phải là 127.0.0.1 — xem ../scripts/setup.sh.
      AIVB_PG_SSLMODE: disable
    volumes:
      - ../config:/app/config:ro
      - appvar:/app/var
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------
  # Game "Vuong Quoc Keo Ngot" (tab Tro choi) - TUY CHON, profile `game`.
  #
  # Khong bat profile thi ba service nay khong ton tai va moi thu chay nhu cu.
  # Bat bang `scripts/Enable-Game.ps1`: no sinh `config/game.env`, khoa
  # `pw_candy_app`, dung database `candy_game` (18_game_database.sql), them
  # `AIVB_GAME_API_URL` vao `config/app.env` va ghi `COMPOSE_PROFILES=game`
  # vao `docker/.env`.
  #
  # Trinh duyet KHONG bao gio noi thang toi game-api: backend proxy
  # `/game/api/*` sang day (backend/game_bridge.py), nen khong cong nao duoc
  # publish ra ngoai.
  # -----------------------------------------------------------------------
  redis:
    image: redis:7.4.5-alpine
    profiles: ["game"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - gameredis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Chay migration cua game (game/sql/migrations) mot lan roi thoat.
  # Idempotent: bang `app_schema_migrations` nho ban nao da ap.
  #
  # KHAC ba service o tren: `game-migrate` (target `ops`) va `game-api` (target
  # `api`) la HAI image that su khac nhau, khong chung ten duoc. Sua gi trong
  # `game/` thi build CA HAI (`Enable-Game.ps1` va `Server.ps1 up -Build` deu
  # lam vay) - build rieng `game-api` thi migration moi khong bao gio duoc chay.
  game-migrate:
    build:
      context: ../game
      dockerfile: infra/production/Containerfile
      target: ops
    profiles: ["game"]
    depends_on:
      restore:
        condition: service_completed_successfully
    env_file:
      - ../config/game.env
    environment:
      NODE_ENV: production
    restart: "no"

  game-api:
    build:
      context: ../game
      dockerfile: infra/production/Containerfile
      target: api
    profiles: ["game"]
    depends_on:
      game-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ../config/game.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      # Trinh duyet thay game o /game/ -> cookie cua game gioi han trong do.
      PUBLIC_BASE_PATH: /game
      LOG_LEVEL: warn
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

secrets:
  pg_superuser:
    file: ../config/pg_superuser.txt

volumes:
  pgdata:
  appvar:
  gameredis:
