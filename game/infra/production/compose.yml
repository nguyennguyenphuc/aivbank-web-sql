name: candy

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: k8s-file
    options:
      max-size: 10m

services:
  web:
    <<: *service-defaults
    image: localhost/match3-h5-web:${IMAGE_TAG:?set IMAGE_TAG to the release Git SHA}
    build:
      context: ../..
      dockerfile: infra/production/Containerfile
      target: web
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA to the full Git SHA}
    read_only: true
    user: "1000:1000"
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - app
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

  api:
    <<: *service-defaults
    image: localhost/match3-h5-api:${IMAGE_TAG:?set IMAGE_TAG to the release Git SHA}
    build:
      context: ../..
      dockerfile: infra/production/Containerfile
      target: api
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA to the full Git SHA}
    env_file:
      - ${MATCH3_ENV_FILE:?set MATCH3_ENV_FILE to the external production env file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    read_only: true
    user: "1000:1000"
    expose:
      - "3001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3001/api/health && wget -q -O /dev/null http://127.0.0.1:3001/api/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.50

  ops:
    image: localhost/match3-h5-ops:${IMAGE_TAG:?set IMAGE_TAG to the release Git SHA}
    build:
      context: ../..
      dockerfile: infra/production/Containerfile
      target: ops
      args:
        RELEASE_SHA: ${RELEASE_SHA:?set RELEASE_SHA to the full Git SHA}
    profiles:
      - operations
    env_file:
      - ${MATCH3_ENV_FILE:?set MATCH3_ENV_FILE to the external production env file}
    environment:
      NODE_ENV: production
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    logging:
      driver: k8s-file
      options:
        max-size: 10m

  postgres:
    <<: *service-defaults
    image: docker.io/library/postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-match3_h5}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-match3_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    read_only: true
    user: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data:U
      - ${BACKUP_DIR:?set BACKUP_DIR to the host backup directory}:/backups:rw
    secrets:
      - source: postgres_password
        target: postgres-password
        uid: "70"
        gid: "70"
        mode: 0400
      - source: match3_db_password
        target: match3-app-password
        uid: "70"
        gid: "70"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.50

  redis:
    <<: *service-defaults
    image: docker.io/library/redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--aclfile", "/run/secrets/users.acl"]
    read_only: true
    user: redis
    volumes:
      - redis_data:/data:U
    secrets:
      - source: redis_acl
        target: users.acl
        uid: "999"
        gid: "1000"
        mode: 0400
      - source: redis_password
        target: redis-password
        uid: "999"
        gid: "1000"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli --user app --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - data
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50

  cloudflared:
    <<: *service-defaults
    image: docker.io/cloudflare/cloudflared:2026.7.2
    command: ["tunnel", "--config", "/run/secrets/cloudflared-config.yml", "--no-autoupdate", "run"]
    read_only: true
    user: "65532:65532"
    secrets:
      - source: cloudflared_config
        target: cloudflared-config.yml
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: cloudflared_credentials
        target: cloudflared-credentials.json
        uid: "65532"
        gid: "65532"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50

networks:
  edge:
    name: candy_edge
  app:
    name: candy_app
    internal: true
  data:
    name: candy_data
    internal: true

volumes:
  postgres_data:
    name: candy_postgres_data
  redis_data:
    name: candy_redis_data

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE to the external password file}
  match3_db_password:
    file: ${MATCH3_DB_PASSWORD_FILE:?set MATCH3_DB_PASSWORD_FILE to the external app-role password file}
  redis_acl:
    file: ${REDIS_ACL_FILE:?set REDIS_ACL_FILE to the external Redis ACL file}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?set REDIS_PASSWORD_FILE to the external Redis password file}
  cloudflared_config:
    file: ${CLOUDFLARED_CONFIG_FILE:?set CLOUDFLARED_CONFIG_FILE to the dedicated candy tunnel config}
  cloudflared_credentials:
    file: ${CLOUDFLARED_CREDENTIALS_FILE:?set CLOUDFLARED_CREDENTIALS_FILE to the dedicated candy tunnel credential}
