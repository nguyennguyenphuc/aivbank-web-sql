# =====================================================================
# pg_hba.conf cho bản chạy Docker — lane Power BI mở ra Internet
# =====================================================================
# Chép vào /var/lib/postgresql/18/docker/pg_hba.conf trong container rồi
# `SELECT pg_reload_conf()`. Xem scripts/Apply-PgHba.ps1.
#
# ---------------------------------------------------------------------
# ĐIỀU QUAN TRỌNG NHẤT: vì sao phân biệt được bằng địa chỉ nguồn
# ---------------------------------------------------------------------
# Bản bare-metal dùng PgRelay để ĐỔI địa chỉ nguồn của kết nối từ Internet
# thành 127.0.0.2, nhờ đó pg_hba tách được lưu lượng học viên khỏi lưu
# lượng quản trị tại chỗ (127.0.0.1). Bỏ relay là âm thầm mở lại quyền
# superuser — `scripts/aivb.ps1` dòng 30-32 cảnh báo đúng điều này.
#
# Trong Docker, cơ chế đó KHÔNG chuyển sang được: không có 127.0.0.2 nào.
# Nhưng Docker tự cho một thứ tương đương và chắc chắn hơn:
#
#     Mọi kết nối đi qua cổng PUBLISH đều tới PostgreSQL với địa chỉ nguồn
#     là GATEWAY của bridge (172.18.0.1), vì Docker NAT chúng.
#     Container ứng dụng thì giữ IP riêng của nó (172.18.0.3).
#
# Vậy 172.18.0.1 CHÍNH LÀ "từ ngoài vào" — đúng vai trò 127.0.0.2 của relay.
# Đó là nền của toàn bộ file này.
#
# KIỂM LẠI SAU KHI ĐỔI MẠNG: nếu subnet của docker_default đổi (dựng lại
# network, đổi tên project), địa chỉ gateway đổi theo và các luật dưới đây
# thành sai — theo hướng TỪ CHỐI HẾT, tức là hỏng an toàn chứ không hỏng
# nguy hiểm. Kiểm bằng:
#     docker network inspect docker_default --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
# ---------------------------------------------------------------------

# TYPE  DATABASE          USER                  ADDRESS          METHOD

# --- Quản trị tại chỗ, bên trong container ---------------------------
# `docker compose exec postgres psql -U postgres` đi qua socket này. Giữ
# `trust` vì ai vào được container thì đã có toàn quyền trên máy rồi.
# Socket Unix: giữ `trust`. Ai vào được container thì đã có toàn quyền trên máy
# rồi, và đây là đường `docker compose exec postgres psql -U postgres` đi.
local   all               all                                    trust

# LOOPBACK TCP: `scram-sha-256`, KHÔNG phải `trust`.
#
# Mặc định của image `postgres` là `trust` cho 127.0.0.1. Điều đó vô hại khi mật
# khẩu chỉ dùng để mở kết nối. Nhưng từ khi XÁC THỰC NGƯỜI DÙNG = MỞ MỘT KẾT NỐI
# (backend/authstore.py::verify_password), `trust` có nghĩa là **mọi mật khẩu đều
# đúng** với bất kỳ ai tới được loopback của container.
#
# Bộ test bắt được đúng chuyện này: nó chạy trong namespace mạng của container
# postgres, nên nguồn là 127.0.0.1, và `verify_password` chấp nhận mật khẩu sai.
# Sản phẩm không dính vì backend nối từ 172.18.0.3 — nhưng đó là may, không phải
# thiết kế, và một ngày nào đó ai đó sẽ chạy app ngay trong container này.
host    all               all                   127.0.0.1/32     scram-sha-256
host    all               all                   ::1/128          scram-sha-256

# --- TỪ NGOÀI MẠNG DOCKER (cổng publish) → chỉ Power BI ---------------
# Ba vai trò BI, mỗi vai trò CHỈ vào đúng database của nó. Chúng là
# NOLOGIN-reader + login role read-only, statement_timeout 300s.
host    aivb_student      aivb_bi_student       172.18.0.1/32    scram-sha-256
host    aivb_instructor   aivb_bi_instructor    172.18.0.1/32    scram-sha-256
host    aivb_student      aivb_bi_instructor    172.18.0.1/32    scram-sha-256
host    scm               scm_bi                172.18.0.1/32    scram-sha-256

# --- Vai trò riêng của từng học viên / giảng viên ---------------------
# `+tên` nghĩa là "bất kỳ THÀNH VIÊN nào của vai trò này". Nhờ vậy thêm một
# học viên KHÔNG phải sửa file này — chỉ cần `GRANT aivb_class_student TO
# svXXX`, việc mà `backend/pgroles.py` làm.
#
# Dùng nhóm RIÊNG (`aivb_class_*`) chứ KHÔNG dùng `+aivb_reader_student`:
# gói đọc đó đã có `aivb_api_student` và `aivb_bi_student` làm thành viên,
# nên viết `+aivb_reader_student` là vô tình mở lại đúng mấy vai trò mà dòng
# `reject` bên dưới tồn tại để chặn.
#
# CHÚ Ý bất đối xứng: nhóm học viên KHÔNG có dòng nào tới `aivb_instructor`.
# Đó là hàng rào chống rò đáp án chấm bài, và `15_class_roles.sql` mục 5 còn
# khẳng định lại ở tầng vai trò. Hai lớp, cùng một tính chất.
host    aivb_student      +aivb_class_student      172.18.0.1/32    scram-sha-256
host    aivb_student      +aivb_class_instructor   172.18.0.1/32    scram-sha-256
host    aivb_instructor   +aivb_class_instructor   172.18.0.1/32    scram-sha-256
host    scm               +aivb_class_student      172.18.0.1/32    scram-sha-256
host    scm               +aivb_class_instructor   172.18.0.1/32    scram-sha-256

# CHẶN mọi thứ còn lại đến từ gateway. Dòng này là thứ giữ cho việc mở
# cổng 5432 ra Internet không trở thành mở luôn quyền superuser:
# `postgres`, `aivb_owner`, `aivb_loader`, và cả các vai trò `*_api` đều
# KHÔNG bao giờ đi được đường này.
#
# Vì sao phải chặn `*_api`: chúng có statement_timeout 20s và bộ đếm khoá
# riêng, được thiết kế cho console web sau lớp guard SQL. Người dùng BI
# BỎ QUA guard hoàn toàn (ARCHITECTURE.md), nên ranh giới an toàn của họ
# chỉ còn là role + GRANT. Đừng để hai lane dùng chung vai trò.
host    all               all                   172.18.0.1/32    reject

# --- Bên trong mạng Docker: backend và bước restore -------------------
# 172.18.0.3 là container backend; service `restore`/`restore-scm` lấy IP
# động trong cùng dải nên để nguyên /16 thay vì ghim từng địa chỉ.
host    all               all                   172.18.0.0/16    scram-sha-256

# --- Ngoài ra: cấm ----------------------------------------------------
# Mặc định của image là `host all all all scram-sha-256` — mọi database,
# mọi role, từ mọi nơi, chỉ cách một lớp mật khẩu. Dòng dưới thay nó.
host    all               all                   all              reject

# --- Replication (không dùng, đóng lại) -------------------------------
local   replication       all                                    trust
host    replication       all                   127.0.0.1/32     trust
host    replication       all                   ::1/128          trust
